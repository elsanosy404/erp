<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة المكتب الهندسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Zain:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16243C;
    --navy-2:#1E3358;
    --steel:#2B4C7E;
    --amber:#E2A03F;
    --amber-dark:#B87A1F;
    --paper:#EEEAE2;
    --card:#FFFFFF;
    --ink:#20242B;
    --ink-soft:#5B6472;
    --line:#DCD6C9;
    --danger:#B4472A;
    --success:#3F7D58;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  #app{min-height:100vh;}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      linear-gradient(var(--navy),var(--navy)),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.045) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.045) 0 1px, transparent 1px 40px);
    padding:24px;
  }
  .login-card{
    background:var(--card);
    width:100%;
    max-width:380px;
    border-radius:4px;
    padding:36px 32px 30px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    border-top:5px solid var(--amber);
  }
  .brand-mark{
    display:flex;align-items:center;gap:10px;margin-bottom:6px;
  }
  .brand-mark .sq{width:14px;height:14px;background:var(--amber);}
  .brand-mark .sq2{width:14px;height:14px;background:var(--navy);margin-inline-start:-4px;}
  .login-card h1{
    font-size:21px;font-weight:900;margin:14px 0 2px;color:var(--navy);
  }
  .login-card p.sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 24px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:700;}
  .field input, .field select, .field textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:3px;
    font-family:inherit;font-size:14.5px;background:#FBFAF7;color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{

  }

  .btn-primary{background:var(--navy);color:#fff;width:100%;padding:12px;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-amber{background:var(--amber);color:var(--navy);}
  .btn-amber:hover{background:var(--amber-dark);color:#fff;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-soft);color:var(--ink);}
  .btn-danger{background:#fff;color:var(--danger);border:1.5px solid var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-sm{padding:6px 12px;font-size:13px;}
  .err{color:var(--danger);font-size:13px;margin:-8px 0 14px;font-weight:700;}

  .sidebar{

  .sidebar .brand small{display:block;color:#9AA6B8;font-size:11.5px;margin-top:4px;}

  .toolbar .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .toolbar select{padding:8px 10px;border:1.5px solid var(--line);border-radius:3px;font-family:inherit;background:#fff;font-size:13.5px;}

  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px 18px;border-top:3px solid var(--steel);}

  .stat-card.danger{border-top-color:var(--danger);}
  .stat-card.success{border-top-color:var(--success);}
  .stat-card .n{font-size:26px;font-weight:900;color:var(--navy);}
  .stat-card .l{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  thead th{background:#F4F1E9;color:var(--navy);text-align:right;font-size:12.5px;font-weight:800;padding:11px 14px;border-bottom:2px solid var(--line);}
  tbody td{padding:11px 14px;font-size:13.5px;border-bottom:1px solid var(--line);color:var(--ink);}

  tbody tr:hover{background:#FAF9F5;}
  .empty-row td{text-align:center;color:var(--ink-soft);padding:34px;font-size:14px;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;background:#EAE6DA;color:var(--ink-soft);}
  .badge.ok{background:#E2EFE6;color:var(--success);}

  .badge.bad{background:#F6E0D8;color:var(--danger);}

  .link-btn{background:none;border:none;color:var(--steel);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;padding:4px 6px;}

  .link-btn.danger{color:var(--danger);}

  .overlay{position:fixed;inset:0;background:rgba(22,36,60,0.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto;}

  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;border-top:1px solid var(--line);padding-top:16px;}
  .perm-table{width:100%;border-collapse:collapse;margin-top:6px;}

  .perm-table td:first-child{text-align:right;font-weight:700;color:var(--ink);}

    .topbar{padding:14px 16px;}
    .content{padding:16px;}
    .form-grid{grid-template-columns:1fr;}
    .menu-btn{display:inline-flex !important;}
  }
  .menu-btn{display:none;background:none;border:1.5px solid var(--line);border-radius:3px;padding:7px 10px;cursor:pointer;font-size:16px;}

  .print-only{display:none;}
  @media print{
    .sidebar, .topbar, .no-print, .overlay { display:none !important; }
    body{background:#fff;}
    .content{padding:0;}
    .print-only{display:block;}
    table{border:1px solid #000;}
    thead th, tbody td{border-color:#999;}
  }
</style>
</head>

/* ===================== Storage layer ===================== */
async function dbGet(key, fallback){
  if(!supabaseClient) return fallback;
  try{
    const { data, error } = await supabaseClient
      .from('erp_data').select('value').eq('key', key).maybeSingle();
    if(error || !data) return fallback;
    return data.value;
  }catch(e){ console.error('load error', e); return fallback; }
}
async function dbSet(key, value){
  if(!supabaseClient){ alert('قاعدة البيانات غير متصلة بعد.'); return; }
  try{
    const { error } = await supabaseClient
      .from('erp_data')
      .upsert({ key, value, updated_at: new Date().toISOString() });
    if(error){ console.error('save error', error); alert('تعذر حفظ البيانات: ' + error.message); }
  }catch(e){ console.error('save error', e); alert('تعذر حفظ البيانات: ' + (e && e.message ? e.message : e)); }
}

/* ===================== Permissions ===================== */
function permLevel(permKey){
  if(!currentUser) return 'none';
  if(currentUser.isAdmin) return 'edit';
  return (currentUser.permissions && currentUser.permissions[permKey]) || 'none';
}
function canView(permKey){ return permLevel(permKey) === 'view' || permLevel(permKey) === 'edit'; }
function canEdit(permKey){ return permLevel(permKey) === 'edit'; }

async function boot(){
  if(SUPABASE_URL.includes('PASTE_') || SUPABASE_ANON_KEY.includes('PASTE_')){

        وضع فيهما بيانات مشروعك من Supabase كما هو موضح في دليل الإعداد.</div>
      </div></div>`;
    return;
  }
  let users = await dbGet('users', null);

  STATE.users = users;
  render();
}

/* ===================== Login ===================== */
function loginScreen(err){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand-mark"><span class="sq"></span><span class="sq2"></span></div>
      <h1>نظام إدارة المكتب الهندسي</h1>
      <p class="sub">تسجيل الدخول للوصول إلى المشاريع والبيانات</p>
      ${err ? `<div class="err">${err}</div>` : ''}
      <form id="loginForm">
        <div class="field"><label>اسم المستخدم</label><input type="text" id="loginUser" required autocomplete="username"></div>
        <div class="field"><label>كلمة المرور</label><input type="password" id="loginPass" required autocomplete="current-password"></div>
        <button class="btn btn-primary" type="submit">دخول</button>
      </form>
    </div>
  </div>`;
}

function attachLoginHandlers(){
  const f = document.getElementById('loginForm');
  f.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    const users = await dbGet('users', STATE.users);
    STATE.users = users;
    const found = users.find(x=>x.username === u && x.password === p);
    if(!found){
      document.getElementById('app').innerHTML = loginScreen('اسم المستخدم أو كلمة المرور غير صحيحة');
      attachLoginHandlers();
      return;
    }
    currentUser = found;
    await loadAllData();
    currentRoute = 'dashboard';
    render();
  });
}

/* ===================== Layout ===================== */
function firstAllowedRoute(){
  for(const item of NAV){
    if(item.special) return item.key;
  }
  return 'dashboard';
}

function navAllowed(item){
  if(item.group) return true;
  if(item.special) return true;
  if(item.adminOnly) return !!currentUser.isAdmin;
  const mod = MODULES[item.module];
  return canView(mod.permKey);
}

function sidebarHTML(){
  let items = '';
  for(const item of NAV){
    if(item.group){ items += `<div class="grp-label">${item.group}</div>`; continue; }
    if(!navAllowed(item)) continue;
    items += `<a class="${currentRoute===item.key?'active':''}" onclick="goRoute('${item.key}')">${item.label}</a>`;
  }
  return `
  <div class="sidebar ${sidebarOpen?'open':''}" id="sidebar">
    <div class="brand"><span class="sq"></span><b>المكتب الهندسي</b><small>نظام إدارة المشاريع</small></div>
    <div class="nav">${items}</div>
    <div class="sidebar-foot"><b>${currentUser.name}</b>${currentUser.isAdmin?'مدير النظام':'مستخدم'}</div>
  </div>`;
}

function topbarTitle(){
  if(currentRoute === 'dashboard') return 'الرئيسية';
  if(currentRoute === 'admin') return 'المستخدمون والصلاحيات';
  if(currentRoute === 'activityLog') return 'سجل العمليات';
  if(currentRoute === 'backup') return 'Backup / Restore';
  const nav = NAV.find(n=>n.key===currentRoute);
  return nav ? MODULES[nav.module].title : '';
}

function mainLayout(){
  return `
  <div class="layout">
    ${sidebarHTML()}
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="menu-btn" onclick="toggleSidebar()">☰</button>
          <h2>${topbarTitle()}</h2>
        </div>
        <div class="user-chip">
          <div class="who"><b>${currentUser.name}</b>${currentUser.username}</div>
          <button class="btn btn-ghost btn-sm" onclick="logout()">خروج</button>

      </div>
      <div class="content" id="content">${routeContent()}</div>
    </div>
  </div>
  ${modalState && !modalState.isUserModal ? modalHTML() : ''}
  `;
}

function logout(){ currentUser = null; render(); }

function goRoute(key){
  currentRoute = key; sidebarOpen = false; render();
}

/* ===================== Route content ===================== */
function routeContent(){
  if(currentRoute === 'dashboard') return dashboardHTML();
  if(currentRoute === 'admin') return currentUser.isAdmin ? adminHTML() : noAccessHTML();
  if(currentRoute === 'activityLog') return currentUser.isAdmin ? activityLogHTML() : noAccessHTML();
  if(currentRoute === 'backup') return currentUser.isAdmin ? backupHTML() : noAccessHTML();
  const nav = NAV.find(n=>n.key===currentRoute);
  if(!nav) return dashboardHTML();
  const mod = MODULES[nav.module];
  if(!canView(mod.permKey)) return noAccessHTML();
  return moduleHTML(nav.module, mod);
}

function noAccessHTML(){
  return `<div class="no-access">لا تملك صلاحية الوصول إلى هذا القسم. تواصل مع مدير النظام لمنحك صلاحية المشاهدة أو التعديل.</div>`;
}

/* ---------- Dashboard ---------- */
function dashboardHTML(){
  const activeProjects = STATE.projects.filter(p=>p.status==='قيد التنفيذ').length;
  const pendingExtracts = STATE.extracts.filter(e=>e.status!=='مصروف').length;
  const lowStock = STATE.warehouseItems.filter(i=> Number(i.qty||0) <= Number(i.minQty||0)).length;
  const income = STATE.finance.filter(f=>f.type==='إيراد').reduce((s,f)=>s+Number(f.amount||0),0);
  const expense = STATE.finance.filter(f=>f.type==='مصروف').reduce((s,f)=>s+Number(f.amount||0),0);

  return `
  <div class="cards-row">
    <div class="stat-card"><div class="n">${STATE.projects.length}</div><div class="l">إجمالي المشاريع</div></div>
    <div class="stat-card amber"><div class="n">${activeProjects}</div><div class="l">مشاريع قيد التنفيذ</div></div>
    <div class="stat-card ${pendingExtracts>0?'amber':''}"><div class="n">${pendingExtracts}</div><div class="l">مستخلصات لم تُصرف بعد</div></div>
    <div class="stat-card ${lowStock>0?'danger':'success'}"><div class="n">${lowStock}</div><div class="l">أصناف عند حد الطلب</div></div>
  </div>
  <div class="cards-row" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));">
    <div class="stat-card success"><div class="n">${income.toLocaleString('ar-EG')}</div><div class="l">إجمالي الإيرادات</div></div>
    <div class="stat-card danger"><div class="n">${expense.toLocaleString('ar-EG')}</div><div class="l">إجمالي المصروفات</div></div>
    <div class="stat-card"><div class="n">${(income-expense).toLocaleString('ar-EG')}</div><div class="l">صافي الرصيد</div></div>
  </div>
  <div class="section-note">هذه البيانات مشتركة بين جميع من يدخل هذا النظام عبر نفس الرابط، ويظهر لكل مستخدم فقط الأقسام المسموح له بها.</div>
  `;
}

/* ---------- Generic module list ---------- */
function moduleHTML(key, mod){
  const list = STATE[key] || [];
  const editable = canEdit(mod.permKey);

  let filterBar = '';
  let filtered = list;
  if(mod.hasProject){
    const pid = projectFilter[key] || '';
    filterBar = `
      <select onchange="setProjectFilter('${key}', this.value)">
        <option value="">كل المشاريع</option>
        ${STATE.projects.map(p=>`<option value="${p.id}" ${pid===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
      </select>`;
    if(pid) filtered = list.filter(r=>r.projectId===pid);
  }

  const rows = filtered.map(r=>{
    const cells = mod.columns.map(([f,_])=>`<td>${formatCell(mod,f,r[f])}</td>`).join('');
    const projCell = mod.hasProject ? `<td>${escapeHtml(projectName(r.projectId))}</td>` : '';
    const creator = r.createdByName || r.createdBy || '—';
    const creatorCell = `<td><span class="badge">${escapeHtml(creator)}</span></td>`;
    const attachCell = `<td>${r.hasAttachment ? `<button class="link-btn" onclick="openAttachment('${key}','${r.id}')">📎 مرفقات</button>` : '<span style="color:#B7B0A0">—</span>'}</td>`;
    return `<tr>
      ${projCell}
      ${cells}
      ${creatorCell}
      ${attachCell}
      <td class="no-print"><div class="row-actions">
        <button class="link-btn" onclick="openEdit('${key}','${r.id}')">${editable?'تعديل':'عرض'}</button>
        ${editable?`<button class="link-btn danger" onclick="deleteRecord('${key}','${r.id}')">حذف</button>`:''}
      </div></td>
    </tr>`;
  }).join('');

  const headCols = mod.columns.map(([_,l])=>`<th>${l}</th>`).join('');
  const projHead = mod.hasProject ? `<th>المشروع</th>` : '';

  return `
    <div class="toolbar no-print">
      <div class="filters">${filterBar}</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" onclick="window.print()">🖨️ طباعة</button>
        ${editable ? `<button class="btn btn-amber" onclick="openNew('${key}')">+ إضافة</button>` : ''}
      </div>
    </div>
    <h3 class="print-only" style="margin:0 0 12px;">${mod.title}</h3>
    <table>
      <thead><tr>${projHead}${headCols}<th>أُضيف بواسطة</th><th>المرفقات</th><th class="no-print"></th></tr></thead>
      <tbody>
        ${rows || `<tr class="empty-row"><td colspan="12">لا توجد بيانات بعد${editable?' — اضغط «إضافة» لبدء الإدخال':''}</td></tr>`}
      </tbody>
    </table>
  `;
}

function setProjectFilter(key, val){ projectFilter[key] = val; render(); }
function projectName(id){ const p = STATE.projects.find(x=>x.id===id); return p ? p.name : '—'; }
function formatCell(mod, field, val){
  if(val === undefined || val === null || val === '') return '<span style="color:#B7B0A0">—</span>';
  const fdef = mod.fields.find(f=>f.name===field);
  if(fdef && fdef.type==='number') return Number(val).toLocaleString('ar-EG');
  if(fdef && fdef.name==='status'){
    const cls = /معتمد|منتهي$|ساري|مصروف/.test(val) ? (val==='مرفوض'||val==='ملغي'?'bad':'ok') : (val==='مرفوض'?'bad':'warn');
    return `<span class="badge ${cls}">${escapeHtml(val)}</span>`;
  }
  return escapeHtml(String(val));
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- Modal (create/edit record) ---------- */
function openNew(key){ modalState = {moduleKey:key, record:{}, isNew:true}; render(); }
function openEdit(key, id){
  const rec = STATE[key].find(r=>r.id===id);
  modalState = {moduleKey:key, record:{...rec}, isNew:false};
  render();
}
function closeModal(){ modalState = null; render(); }

function modalHTML(){
  const {moduleKey, record, isNew} = modalState;
  const mod = MODULES[moduleKey];
  const editable = canEdit(mod.permKey);

  let projField = '';
  if(mod.hasProject){
    projField = `<div class="field full">
      <label>المشروع *</label>
      <select id="f_projectId" ${!editable?'disabled':''}>
        <option value="">— اختر مشروع —</option>
        ${STATE.projects.map(p=>`<option value="${p.id}" ${record.projectId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
      </select>
    </div>`;
  }

  const fieldsHTML = mod.fields.map(f=>{
    const isFull = f.type==='textarea';
    const val = record[f.name] !== undefined ? record[f.name] : '';
    let input = '';
    if(f.type==='select'){
      input = `<select id="f_${f.name}" ${!editable?'disabled':''}>
        <option value="">—</option>
        ${f.options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}
      </select>`;
    } else if(f.type==='textarea'){
      input = `<textarea id="f_${f.name}" rows="3" ${!editable?'disabled':''}>${escapeHtml(val)}</textarea>`;
    } else {
      input = `<input type="${f.type}" id="f_${f.name}" value="${escapeHtml(val)}" ${!editable?'disabled':''}>`;
    }
    return `<div class="field ${isFull?'full':''}"><label>${f.label}${f.required?' *':''}</label>${input}</div>`;
  }).join('');

  return `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h3>${isNew ? 'إضافة سجل — ' : (editable?'تعديل سجل — ':'عرض سجل — ')}${mod.title}</h3>
      ${!isNew && (record.createdByName||record.createdBy) ? `<div class="section-note">تمت الإضافة بواسطة: <b>${escapeHtml(record.createdByName||record.createdBy)}</b>${record.updatedByName?` — آخر تعديل بواسطة: <b>${escapeHtml(record.updatedByName)}</b>`:''}</div>` : ''}
      <div class="form-grid">
        ${projField}
        ${fieldsHTML}
        ${editable ? `<div class="field full">
          <label>مرفق (صورة أو ملف)</label>
          <input type="file" id="f_attachment">
          ${record.hasAttachment ? `<div style="font-size:12.5px;color:var(--ink-soft);margin-top:6px;">📎 يوجد مرفق حالياً: ${escapeHtml(record.attachmentName||'')} — اختيار ملف جديد هيستبدله</div>` : ''}
        </div>` : (record.hasAttachment ? `<div class="field full"><label>المرفق</label><button class="link-btn" onclick="openAttachment('${moduleKey}','${record.id}')">📎 ${escapeHtml(record.attachmentName||'فتح المرفق')}</button></div>` : '')}
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">إغلاق</button>
        ${editable ? `<button class="btn btn-primary" onclick="saveRecord()">حفظ</button>` : ''}
      </div>
    </div>
  </div>`;
}

async function saveRecord(){
  const {moduleKey, record, isNew} = modalState;
  const mod = MODULES[moduleKey];

  if(mod.hasProject){
    const pid = document.getElementById('f_projectId').value;
    if(!pid){ alert('من فضلك اختر المشروع'); return; }
    record.projectId = pid;
  }
  for(const f of mod.fields){
    const el = document.getElementById('f_'+f.name);
    const v = el.value;
    if(f.required && !v){ alert('من فضلك أدخل: '+f.label); return; }
    record[f.name] = v;
  }
  if(isNew){
    record.id = genId();
    record.createdBy = currentUser.username;
    record.createdByName = currentUser.name;
    STATE[moduleKey].push(record);
  } else {
    record.updatedBy = currentUser.username;
    record.updatedByName = currentUser.name;
    const idx = STATE[moduleKey].findIndex(r=>r.id===record.id);
    STATE[moduleKey][idx] = record;
  }

  const fileInput = document.getElementById('f_attachment');
  const file = fileInput && fileInput.files && fileInput.files[0];
  if(file){
    if(file.size > 4 * 1024 * 1024){
      alert('حجم المرفق كبير جداً (الحد الأقصى تقريباً 4 ميجا). لم يتم رفع المرفق، لكن باقي بيانات السجل اتحفظت.');
    } else {
      try{
        const dataUrl = await new Promise((resolve, reject)=>{
          const reader = new FileReader();
          reader.onload = ()=>resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        await dbSet('attach_'+moduleKey+'_'+record.id, {name:file.name, dataUrl});
        record.hasAttachment = true;
        record.attachmentName = file.name;
      }catch(e){ console.error('attachment error', e); alert('تعذر رفع المرفق.'); }
    }
  }

  await dbSet(moduleKey, STATE[moduleKey]);
  modalState = null;
  render();
}

async function openAttachment(moduleKey, id){
  const data = await dbGet('attach_'+moduleKey+'_'+id, null);
  if(!data){ alert('تعذر العثور على المرفق.'); return; }
  const a = document.createElement('a');
  a.href = data.dataUrl;
  a.download = data.name || 'attachment';
  a.target = '_blank';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function deleteRecord(moduleKey, id){
  if(!confirm('هل تريد حذف هذا السجل؟')) return;
  STATE[moduleKey] = STATE[moduleKey].filter(r=>r.id!==id);
  await dbSet(moduleKey, STATE[moduleKey]);
  render();
}

/* ===================== Admin: users & permissions ===================== */
function adminHTML(){
  const rows = STATE.users.map(u=>`
    <tr>
      <td>${escapeHtml(u.name)}</td>
      <td>${escapeHtml(u.username)}</td>
      <td>${u.isAdmin ? '<span class="badge ok">مدير كامل الصلاحيات</span>' : '<span class="badge">مستخدم</span>'}</td>
      <td><div class="row-actions">
        <button class="link-btn" onclick="openUserEdit('${u.id}')">تعديل</button>
        ${u.username!=='admin' ? `<button class="link-btn danger" onclick="deleteUser('${u.id}')">حذف</button>` : ''}
      </div></td>
    </tr>`).join('');

  return `
    <div class="section-note">من هنا تنشئ حسابات للمهندسين والموظفين، وتحدد لكل واحد صلاحية «مشاهدة فقط» أو «تعديل» في كل قسم على حدة، أو تجعله مديراً بكامل الصلاحيات.</div>
    <div class="toolbar">
      <div></div>
      <button class="btn btn-amber" onclick="openUserNew()">+ إضافة مستخدم</button>
    </div>
    <table>
      <thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الدور</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${modalState && modalState.isUserModal ? userModalHTML() : ''}
  `;
}

function openUserNew(){
  modalState = {isUserModal:true, isNew:true, record:{isAdmin:false, permissions:{}}};
  render();
}
function openUserEdit(id){
  const u = STATE.users.find(x=>x.id===id);
  modalState = {isUserModal:true, isNew:false, record:JSON.parse(JSON.stringify(u))};
  render();
}
async function deleteUser(id){
  if(!confirm('هل تريد حذف هذا المستخدم؟')) return;
  STATE.users = STATE.users.filter(u=>u.id!==id);
  await dbSet('users', STATE.users);
  render();
}

function userModalHTML(){
  const {record, isNew} = modalState;
  const permRows = PERM_KEYS.map(pk=>{
    const level = (record.permissions && record.permissions[pk]) || 'none';
    return `<tr>
      <td>${PERM_LABELS[pk]}</td>
      <td><select id="perm_${pk}" ${record.isAdmin?'disabled':''}>
        <option value="none" ${level==='none'?'selected':''}>لا يوجد</option>
        <option value="view" ${level==='view'?'selected':''}>مشاهدة</option>
        <option value="edit" ${level==='edit'?'selected':''}>تعديل</option>
      </select></td>
    </tr>`;
  }).join('');

  return `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal" style="max-width:640px;">
      <h3>${isNew?'إضافة مستخدم جديد':'تعديل بيانات المستخدم'}</h3>
      <div class="form-grid">
        <div class="field"><label>الاسم الكامل *</label><input id="u_name" value="${escapeHtml(record.name||'')}"></div>
        <div class="field"><label>اسم المستخدم *</label><input id="u_username" value="${escapeHtml(record.username||'')}" ${record.username==='admin'?'disabled':''}></div>
        <div class="field"><label>كلمة المرور ${isNew?'*':'(اتركها فارغة لعدم التغيير)'}</label><input id="u_password" type="text" value=""></div>
        <div class="field">
          <label>الدور</label>
          <select id="u_isAdmin" onchange="toggleAdminPreview(this.value)">
            <option value="0" ${!record.isAdmin?'selected':''}>مستخدم بصلاحيات محددة</option>
            <option value="1" ${record.isAdmin?'selected':''}>مدير كامل الصلاحيات</option>
          </select>
        </div>
      </div>
      <div class="field full" style="margin-top:14px;">
        <label>صلاحيات الأقسام</label>
        <table class="perm-table">
          <thead><tr><th style="text-align:right;">القسم</th><th>المستوى</th></tr></thead>
          <tbody id="permBody">${permRows}</tbody>
        </table>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
        <button class="btn btn-primary" onclick="saveUser()">حفظ</button>
      </div>
    </div>
  </div>`;
}

function toggleAdminPreview(val){
  const disabled = val==='1';
  PERM_KEYS.forEach(pk=>{
    const el = document.getElementById('perm_'+pk);
    if(el) el.disabled = disabled;
  });
}

async function saveUser(){
  const {record, isNew} = modalState;
  const name = document.getElementById('u_name').value.trim();
  const username = document.getElementById('u_username').value.trim();
  const password = document.getElementById('u_password').value;
  const isAdmin = document.getElementById('u_isAdmin').value === '1';

  if(!name || !username){ alert('من فضلك أدخل الاسم واسم المستخدم'); return; }
  if(isNew && !password){ alert('من فضلك أدخل كلمة مرور'); return; }
  const dup = STATE.users.find(u=>u.username===username && u.id!==record.id);
  if(dup){ alert('اسم المستخدم مستخدم بالفعل'); return; }

  const permissions = {};
  PERM_KEYS.forEach(pk=>{
    const el = document.getElementById('perm_'+pk);
    permissions[pk] = el ? el.value : 'none';
  });

  if(isNew){
    STATE.users.push({
      id:genId(), name, username, password, isAdmin, permissions
    });
  } else {
    const idx = STATE.users.findIndex(u=>u.id===record.id);
    STATE.users[idx].name = name;
    STATE.users[idx].username = username;
    if(password) STATE.users[idx].password = password;
    STATE.users[idx].isAdmin = isAdmin;
    STATE.users[idx].permissions = permissions;
    if(currentUser.id === record.id) currentUser = STATE.users[idx];
  }
  await dbSet('users', STATE.users);
  modalState = null;
  render();
}

/* ===================== Activity Log ===================== */
function activityLogHTML(){
  const entries = [];
  for(const key of Object.keys(MODULES)){
    const list = STATE[key] || [];
    for(const r of list){
      if(r.createdByName || r.createdBy){
        entries.push({date:r.date||r.startDate||'', who:r.createdByName||r.createdBy, action:'إضافة', module:MODULES[key].title});
      }
      if(r.updatedByName){
        entries.push({date:r.date||r.startDate||'', who:r.updatedByName, action:'تعديل', module:MODULES[key].title});
      }
    }
  }
  const rows = entries.map(e=>`
    <tr>
      <td>${escapeHtml(e.module)}</td>
      <td><span class="badge ${e.action==='إضافة'?'ok':'warn'}">${e.action}</span></td>
      <td>${escapeHtml(e.who)}</td>
      <td>${escapeHtml(e.date||'—')}</td>
    </tr>`).join('');
  return `
    <div class="section-note">سجل بكل عمليات الإضافة والتعديل عبر كل أقسام النظام، مرتب حسب القسم.</div>
    <div class="toolbar no-print"><div></div><button class="btn btn-ghost" onclick="window.print()">🖨️ طباعة</button></div>
    <table>
      <thead><tr><th>القسم</th><th>العملية</th><th>بواسطة</th><th>تاريخ السجل</th></tr></thead>
      <tbody>${rows || `<tr class="empty-row"><td colspan="4">لا توجد عمليات مسجلة بعد</td></tr>`}</tbody>
    </table>
  `;
}

/* ===================== Backup / Restore ===================== */
async function exportBackup(){
  const allKeys = ['users', ...Object.keys(MODULES)];
  const dump = {};
  for(const k of allKeys){ dump[k] = STATE[k] || []; }
  const blob = new Blob([JSON.stringify(dump, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'erp-backup-' + todayISO() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function importBackupFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!confirm('استيراد النسخة الاحتياطية هيستبدل البيانات الحالية في الأقسام الموجودة بالملف. متأكد؟')) { input.value=''; return; }
  try{
    const text = await file.text();
    const dump = JSON.parse(text);
    for(const key of Object.keys(dump)){
      STATE[key] = dump[key];
      await dbSet(key, dump[key]);
    }
    alert('تم استرجاع النسخة الاحتياطية بنجاح.');
    render();
  }catch(e){
    console.error(e);
    alert('تعذرت قراءة الملف — تأكد إنه ملف Backup صحيح.');
  }
  input.value = '';
}

function backupHTML(){
  return `
    <div class="section-note">
      يمكنك تحميل نسخة احتياطية كاملة من كل بيانات النظام كملف JSON، أو استرجاع نسخة سابقة.
    </div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;">
      <div class="stat-card" style="flex:1;min-width:240px;">
        <div class="l" style="margin-bottom:10px;">تنزيل نسخة احتياطية من كل البيانات</div>
        <button class="btn btn-amber" onclick="exportBackup()">⬇️ تحميل Backup</button>
      </div>
      <div class="stat-card" style="flex:1;min-width:240px;">
        <div class="l" style="margin-bottom:10px;">استرجاع نسخة احتياطية (ملف JSON)</div>
        <input type="file" accept="application/json" onchange="importBackupFile(this)">
      </div>
    </div>
  `;
}

/* ===================== Render root ===================== */
function render(){
  const app = document.getElementById('app');
  if(!currentUser){
    app.innerHTML = loginScreen();
    attachLoginHandlers();
    return;
  }
  app.innerHTML = mainLayout();
}

boot();
</script>
